<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Акт о браке/возврате</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#dde4e9;
    --paper-2:#eef1f4;
    --ink:#1c2b3a;
    --ink-soft:#4b5c6b;
    --rule:#aab8c2;
    --rule-soft:#c7d1d8;
    --amber:#c07830;
    --amber-deep:#9c5f22;
    --red:#a9392b;
    --white:#fbfaf7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--rule-soft) 1px, transparent 1px);
    background-size: 100% 34px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:18px 14px 24px;}

  header.top{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:6px 2px 18px;
    border-bottom:2px solid var(--ink);
    margin-bottom:18px;
    gap:6px;
  }
  header.top .title{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
    line-height:1.15;
  }
  header.top .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  header.top .num-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--white);
    background:var(--ink);
    padding:5px 9px;
    border-radius:6px;
    white-space:nowrap;
  }
  header.top .clear-btn{
    margin-top:2px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.02em;
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
  }
  header.top .clear-btn:active{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .field-row.single{grid-template-columns:1fr;}
  .field{
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:8px 10px 7px;
  }
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .field input{
    width:100%;
    border:none;background:transparent;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    padding:2px 0;
  }
  .field input:focus{outline:none;}
  .field input::placeholder{color:#9aa8b3;font-weight:400;}

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin:22px 2px 8px;
    display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--rule);}

  .rows{display:flex;flex-direction:column;gap:10px;}
  .row-card{
    background:var(--white);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:12px 12px 10px;
    position:relative;
    box-shadow:0 1px 0 rgba(28,43,58,0.03);
  }
  .row-card .row-index{
    position:absolute;top:-9px;left:10px;
    background:var(--ink);color:var(--white);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:20px;
  }
  .row-card .remove-btn{
    position:absolute;top:8px;right:8px;
    width:26px;height:26px;border-radius:50%;
    border:1px solid var(--rule-soft);background:var(--paper-2);
    color:var(--ink-soft);font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .row-card .remove-btn:active{background:var(--red);color:#fff;border-color:var(--red);}

  .row-grid{
    display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px;
  }
  .row-pos label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;
    color:var(--ink-soft);letter-spacing:0.03em;display:block;margin-bottom:2px;
  }
  .row-pos input{
    width:100%;border:1px solid var(--rule-soft);border-radius:7px;
    background:var(--paper-2);padding:6px 7px;font-size:14px;
    font-family:'IBM Plex Mono',monospace;color:var(--ink);
  }
  .row-pos input:focus{outline:none;border-color:var(--amber);}
  .row-name{position:relative;}
  .row-name input{
    width:100%;border:none;border-bottom:1px solid var(--rule-soft);
    background:transparent;font-size:15px;font-weight:600;color:var(--ink);
    padding:4px 2px 6px;font-family:'Inter',sans-serif;
  }
  .row-name input:focus{outline:none;border-color:var(--amber);}
  .row-name input::placeholder{color:#b0bcc5;font-weight:500;}

  .suggest-list{
    position:absolute;left:0;right:0;top:100%;margin-top:4px;
    background:var(--white);border:1px solid var(--rule);border-radius:10px;
    box-shadow:0 8px 24px rgba(28,43,58,0.18);
    max-height:220px;overflow-y:auto;
    z-index:30;display:none;
  }
  .suggest-list.open{display:block;}
  .suggest-item{
    padding:9px 12px;font-size:13.5px;font-family:'Inter',sans-serif;
    color:var(--ink);border-bottom:1px solid var(--paper-2);cursor:pointer;
  }
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:active,.suggest-item.active{background:#f6ede2;}
  .suggest-item mark{background:#f0c48a;color:var(--ink);border-radius:2px;padding:0 1px;}
  .suggest-empty{
    padding:9px 12px;font-size:12.5px;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .suggest-count{
    padding:6px 12px;font-size:10.5px;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;border-bottom:1px solid var(--paper-2);
    text-transform:uppercase;letter-spacing:0.03em;
  }

  .row-desc label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;
    color:var(--ink-soft);letter-spacing:0.03em;display:block;margin-bottom:3px;
  }
  .row-desc select{
    width:100%;
    border:1px solid var(--rule-soft);border-radius:7px;
    background:var(--paper-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%234b5c6b"/></svg>') no-repeat right 10px center;
    font-size:14px;font-weight:600;color:var(--red);
    font-family:'Inter',sans-serif;padding:8px 26px 8px 9px;
    appearance:none;-webkit-appearance:none;
  }
  .row-desc select:invalid{color:#9aa8b3;font-weight:400;}
  .row-desc select:focus{outline:none;border-color:var(--red);}

  .row-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .num-field label{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;
    color:var(--ink-soft);letter-spacing:0.03em;display:block;margin-bottom:2px;
  }
  .num-field input{
    width:100%;border:1px solid var(--rule-soft);border-radius:7px;
    background:var(--paper-2);padding:6px 7px;font-size:14px;
    font-family:'IBM Plex Mono',monospace;color:var(--ink);
  }
  .num-field input:focus{outline:none;border-color:var(--amber);}
  .num-field.total input{
    background:#f3e6d8;border-color:var(--amber);color:var(--amber-deep);font-weight:700;
  }

  .add-row-btn{
    margin-top:12px;width:100%;
    border:1.5px dashed var(--rule);
    background:transparent;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:0.03em;
    padding:11px;border-radius:12px;cursor:pointer;
  }
  .add-row-btn:active{border-color:var(--amber);color:var(--amber-deep);background:#f6ede2;}

  .total-strip{
    margin-top:20px;
    background:var(--ink);color:var(--white);
    border-radius:14px;padding:14px 16px;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .total-strip .label{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    text-transform:uppercase;letter-spacing:0.05em;color:#aeb9c4;
  }
  .total-strip .value{
    font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:#f0c48a;
  }

  .signoff{margin-top:20px;display:flex;flex-direction:column;gap:10px;}

  .actions{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(to top, var(--paper) 60%, rgba(221,228,233,0));
    padding:14px 14px 18px;
  }
  .actions-inner{
    max-width:720px;margin:0 auto;
    display:flex;gap:8px;
  }
  .btn{
    flex:1;border:none;border-radius:12px;padding:13px 6px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
    letter-spacing:0.01em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-primary{background:var(--amber);color:#fff;}
  .btn-primary:active{background:var(--amber-deep);}
  .btn-secondary{background:var(--ink);color:#fff;}
  .btn-secondary:active{background:#0f1922;}
  .btn-ghost{background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);}
  .btn-ghost:active{background:var(--rule-soft);}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:30px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:420px){
    .field-row{grid-template-columns:1fr;}
  }

  @media print{
    @page { size: A4 landscape; margin: 0; }
    body{background:#fff;padding:0;}
    .wrap, .toast{display:none !important;}
    #printTemplate{display:block !important;}
  }

  /* ---- exact template replica, sized to 1/4 of an A4 landscape sheet ---- */
  #printTemplate{
    display:none;
    width:297mm;
    height:210mm;
    background:#fff;
    box-sizing:border-box;
  }
  .pt-quarter{
    width:148.5mm;
    height:105mm;
    box-sizing:border-box;
    padding:6mm 7mm;
    border:1px dashed #999;
    color:#000;
    font-family:'Inter',Arial,sans-serif;
    overflow:hidden;
  }
  .pt-photo{
    display:inline-block;
    width:148.5mm;
    box-sizing:border-box;
    padding:6mm 7mm;
    color:#000;
    font-family:'Inter',Arial,sans-serif;
    background:#fff;
  }
  .pt-title{
    text-align:center;
    font-size:15px;
    font-weight:600;
    margin:1px 0 8px;
  }
  .pt-field{font-size:8.5px;margin:0 0 3.5px 1px;}
  .pt-field .fill{
    display:inline-block;min-width:64px;border-bottom:1px solid #000;
    padding:0 3px 0;font-weight:600;
  }
  .pt-inline-fields{font-size:8.5px;margin:6px 0 5px 1px;}
  .pt-inline-fields .fill{
    display:inline-block;min-width:28px;border-bottom:1px solid #000;
    padding:0 3px 0;font-weight:600;margin-right:10px;
  }

  .pt-table{
    width:100%;border-collapse:collapse;margin-top:5px;
  }
  .pt-table th, .pt-table td{
    border:1px solid #000;
    padding:2px 3px;
    font-size:6.8px;
    vertical-align:top;
  }
  .pt-table th{
    font-weight:700;text-align:left;background:#fff;
  }
  .pt-table td.pt-num{width:14px;text-align:center;}
  .pt-table td.pt-pos{width:32px;text-align:center;}
  .pt-table td.pt-qty{width:28px;text-align:center;}
  .pt-table td.pt-price{width:34px;text-align:right;}
  .pt-table td.pt-total{width:34px;text-align:right;}
  .pt-table td.pt-name{width:22%;}
  .pt-table td.pt-desc{width:auto;}
  .pt-table tr{height:13px;}

  .pt-footer{margin-top:7px;font-size:8.5px;}
  .pt-footer .pt-line{margin:0 0 4.5px 1px;}
  .pt-footer .fill-long{
    display:inline-block;min-width:120px;border-bottom:1px solid #000;
    padding:0 3px 0;font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="title">Акт о браке / возврате</div>
      <div class="sub">форма склада · заполняется на месте</div>
    </div>
    <div class="num-badge" id="dateBadge">—</div>
    <button class="clear-btn" id="clearBtn" type="button">Очистить форму</button>
  </header>

  <div class="field-row">
    <div class="field">
      <label>№ накладной</label>
      <input id="invoiceNo" placeholder="напр. 10452" inputmode="text">
    </div>
    <div class="field">
      <label>Дата</label>
      <input id="actDate" type="date">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Название организации</label>
      <input id="orgName" placeholder="Абсолют / клиент">
    </div>
    <div class="field">
      <label>Населённый пункт</label>
      <input id="city" placeholder="город">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Принято мест, всего</label>
      <input id="placesCount" placeholder="кол-во мест" inputmode="numeric">
    </div>
    <div class="field">
      <label>Состояние коробов</label>
      <input id="boxState" placeholder="целые / вскрытые / повреждены">
    </div>
  </div>

  <div class="section-label">Позиции</div>

  <div class="rows" id="rowsContainer"></div>

  <button class="add-row-btn" id="addRowBtn">+ добавить позицию</button>

  <div class="total-strip">
    <div class="label">Итого сумма</div>
    <div class="value" id="grandTotal">0.00</div>
  </div>

  <div class="section-label">Подписи</div>
  <div class="signoff">
    <div class="field">
      <label>Менеджер</label>
      <input id="managerName" placeholder="ФИО">
    </div>
    <div class="field">
      <label>Начальник склада</label>
      <input id="warehouseHead" placeholder="ФИО">
    </div>
  </div>

</div>

<div class="toast" id="toast">Готово</div>

<div id="printTemplate"></div>

<div class="actions">
  <div class="actions-inner">
    <button class="btn btn-ghost" id="printBtn">Печать</button>
    <button class="btn btn-secondary" id="photoBtn">Фото</button>
    <button class="btn btn-secondary" id="pdfBtn">PDF</button>
    <button class="btn btn-primary" id="shareBtn">Отправить</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

// ---- product search (multi-word, substring) ----
function norm(s){
  return s.toLowerCase().replace(/ё/g,'е').trim();
}
const PRODUCTS_NORM = PRODUCTS.map(p => ({raw:p, norm: norm(p)}));

function searchProducts(query, limit){
  const words = norm(query).split(/\s+/).filter(Boolean);
  if(!words.length) return [];
  const matches = [];
  for(const item of PRODUCTS_NORM){
    if(words.every(w => item.norm.includes(w))){
      matches.push(item.raw);
      if(matches.length >= limit) break;
    }
  }
  return matches;
}

function highlight(name, query){
  const words = norm(query).split(/\s+/).filter(Boolean);
  let html = '';
  const lower = name.toLowerCase();
  let i = 0;
  // simple highlight: wrap each occurrence of each word (first match pass, non-overlapping-ish)
  let ranges = [];
  for(const w of words){
    let idx = lower.indexOf(w);
    while(idx !== -1){
      ranges.push([idx, idx+w.length]);
      idx = lower.indexOf(w, idx+w.length);
    }
  }
  ranges.sort((a,b)=>a[0]-b[0]);
  let merged = [];
  for(const r of ranges){
    if(merged.length && r[0] <= merged[merged.length-1][1]){
      merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], r[1]);
    } else {
      merged.push(r.slice());
    }
  }
  let pos = 0;
  for(const [s,e] of merged){
    html += escapeHtml(name.slice(pos,s)) + '<mark>' + escapeHtml(name.slice(s,e)) + '</mark>';
    pos = e;
  }
  html += escapeHtml(name.slice(pos));
  return html;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function attachAutocomplete(card){
  const input = card.querySelector('.name-input');
  const list = card.querySelector('.suggest-list');

  function closeList(){
    list.classList.remove('open');
    list.innerHTML = '';
  }

  function renderList(query){
    const results = searchProducts(query, 40);
    list.innerHTML = '';
    if(!results.length){
      list.innerHTML = '<div class="suggest-empty">ничего не найдено — можно ввести вручную</div>';
      list.classList.add('open');
      return;
    }
    const count = document.createElement('div');
    count.className = 'suggest-count';
    count.textContent = `найдено: ${results.length}${results.length===40?'+':''}`;
    list.appendChild(count);
    results.forEach(name=>{
      const item = document.createElement('div');
      item.className = 'suggest-item';
      item.innerHTML = highlight(name, query);
      item.addEventListener('mousedown', (e)=>{
        e.preventDefault();
        input.value = name;
        closeList();
      });
      list.appendChild(item);
    });
    list.classList.add('open');
  }

  input.addEventListener('input', ()=>{
    const q = input.value;
    if(q.trim().length < 2){ closeList(); return; }
    renderList(q);
  });
  input.addEventListener('focus', ()=>{
    if(input.value.trim().length >= 2) renderList(input.value);
  });
  input.addEventListener('blur', ()=>{
    setTimeout(closeList, 120);
  });
}

  return (Math.round(n*100)/100).toFixed(2);
}

  toastEl.textContent = msg;

}

function recalcRow(card){
  const qty = parseFloat(card.querySelector('.qty-input').value) || 0;
  const price = parseFloat(card.querySelector('.price-input').value) || 0;
  const total = qty * price;
  card.querySelector('.total-input').value = total ? fmt(total) : '';
  recalcGrand();
}

function recalcGrand(){
  let sum = 0;
  rowsContainer.querySelectorAll('.row-card').forEach(card=>{
    sum += parseFloat(card.querySelector('.total-input').value) || 0;
  });
  grandTotalEl.textContent = fmt(sum);
}

}

function buildCopyHtml(minRows, includeData){

  const rows = includeData ? [...rowsContainer.querySelectorAll('.row-card')].map(card => ({
    pos: card.querySelector('.pos-input').value || '',

    qty: card.querySelector('.qty-input').value || '',
    price: card.querySelector('.price-input').value || '',
    total: card.querySelector('.total-input').value || ''

      <td class="pt-price">${esc(r.price)}</td>
      <td class="pt-total">${esc(r.total)}</td>

  const totalStr = includeData ? esc(grandTotalEl.textContent) : '';

  return `
    <div class="pt-title">Акт о браке/возврате</div>

    <div class="pt-field">№ Накладной <span class="fill">${val('invoiceNo')}</span></div>

    <div class="pt-field">Название организации <span class="fill">${val('orgName')}</span></div>
    <div class="pt-field">Населеный пункт <span class="fill">${val('city')}</span></div>

    <div class="pt-inline-fields">
      Принято мест, всего <span class="fill">${val('placesCount')}</span>

    <table class="pt-table">
      <thead>
        <tr>
          <th class="pt-num">№</th>
          <th class="pt-pos">№ поз. в накл.</th>
          <th class="pt-name">Наименование</th>

// PDF export — A4 landscape sheet, act occupies exactly 1/4 of it
document.getElementById('pdfBtn').addEventListener('click', async ()=>{
  showToast('Готовим PDF…');
  buildPrintTemplate();
  const quarter = document.querySelector('#printTemplate .pt-quarter');
  const tpl = document.getElementById('printTemplate');
  tpl.style.display = 'block';
  const canvas = await html2canvas(quarter, {scale:3, backgroundColor:'#ffffff'});
  tpl.style.display = 'none';
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('l','mm','a4'); // 297 x 210 mm
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  pdf.addImage(imgData, 'JPEG', 0, 0, 148.5, 105); // top-left quarter
  const invoiceNo = document.getElementById('invoiceNo').value || 'бн';
  pdf.save(`Akt_${invoiceNo}_${dateInput.value}.pdf`);
  showToast('PDF сохранён');
});

// photo export (PNG) — uses a Blob + new tab instead of the download attribute,
// since Safari/iOS (especially inside Quick Look) often ignores <a download>.
document.getElementById('photoBtn').addEventListener('click', async ()=>{
  showToast('Готовим фото…');
  buildPhotoTemplate();
  const photo = document.querySelector('#printTemplate .pt-photo');
  const tpl = document.getElementById('printTemplate');
  tpl.style.display = 'block';
  const canvas = await html2canvas(photo, {scale:3, backgroundColor:'#ffffff'});
  tpl.style.display = 'none';

  canvas.toBlob((blob)=>{
    if(!blob){ showToast('Не удалось создать фото'); return; }
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if(!win){
      // popup blocked — fall back to a normal download link
      const invoiceNo = document.getElementById('invoiceNo').value || 'бн';
      const link = document.createElement('a');
      link.download = `Akt_${invoiceNo}_${dateInput.value}.png`;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }
    showToast('Фото готово — удержите на изображении, чтобы сохранить');
  }, 'image/png');
});

// share the act as a photo to a messenger, with a caption:
// line 1 — client/organisation name, line 2 — the defect description(s) used in the act
document.getElementById('shareBtn').addEventListener('click', async ()=>{
  showToast('Готовим фото…');
  buildPhotoTemplate();
  const photo = document.querySelector('#printTemplate .pt-photo');
  const tpl = document.getElementById('printTemplate');
  tpl.style.display = 'block';
  const canvas = await html2canvas(photo, {scale:4, backgroundColor:'#ffffff'});
  tpl.style.display = 'none';

  const orgName = document.getElementById('orgName').value.trim() || 'Клиент не указан';
  const descs = [...rowsContainer.querySelectorAll('.desc-input')]
    .map(el => el.value)
    .filter(Boolean);
  const uniqueDescs = [...new Set(descs)];
  const descLine = uniqueDescs.length ? uniqueDescs.join(', ') : '—';
  const caption = `${orgName}\n${descLine}`;

  const invoiceNo = document.getElementById('invoiceNo').value || 'бн';
  const fileName = `Akt_${invoiceNo}_${dateInput.value}.png`;

  canvas.toBlob(async (blob)=>{
    if(!blob){ showToast('Не удалось создать фото'); return; }
    const file = new File([blob], fileName, {type:'image/png'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Акт о браке/возврате', text: caption});
        return;
      }catch(e){ /* user cancelled or share failed — fall through to fallback */ }
    }

    // Fallback for browsers/contexts without file sharing (e.g. Quick Look preview):
    // open the photo so it can be saved, and copy the caption for pasting into the chat.
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    try{
      await navigator.clipboard.writeText(caption);
      showToast('Фото открыто, подпись скопирована — вставьте в сообщение');
    }catch(e){
      showToast('Фото открыто — удержите, чтобы сохранить и отправить');
    }
  }, 'image/png');
});
</script>
